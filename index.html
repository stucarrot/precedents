 const prev=nb(-1),next=nb(1),goN=r=>r&&open(r.repo,r.path,false,nav);
 const reads=(rec&&rec.reads)||[];
 const addRead=()=>{const now=Date.now();upd(r=>({...r,reads:[...(r.reads||[]),now]}))};
 const delRead=k=>upd(r=>({...r,reads:(r.reads||[]).filter((_,x)=>x!==k)}));
 const rdDown=()=>{lp.current.f=false;clearTimeout(lp.current.t);lp.current.t=setTimeout(()=>{lp.current.f=true;setRl(true);try{navigator.vibrate&&navigator.vibrate(15)}catch{}},500)};
 const rdUp=()=>{clearTimeout(lp.current.t);if(!lp.current.f)addRead()};
 const rdCancel=()=>clearTimeout(lp.current.t);
 const Bt=({on,children,...p})=><button {...p} className={`h-9 min-w-8 sm:min-w-9 px-1.5 sm:px-2 flex items-center justify-center rounded-md transition-colors hover:bg-[#F0F0EE] ${on?'bg-[#E6EBE1]':''} ${p.className||''}`}>{children}</button>;
 const drawer=(side,on,kind)=><><div onClick={()=>side==='l'?setL(false):setR(false)} className={`lg:hidden fixed inset-0 bg-black/20 z-20 transition-opacity ${on?'opacity-100':'opacity-0 pointer-events-none'}`}/>
  <aside className={`fixed top-0 bottom-0 z-30 w-[88vw] max-w-80 lg:w-80 bg-white transition-transform duration-200 ${side==='l'?'left-0 border-r':'right-0 border-r-0 border-l'} border-[#E5E5E5] ${on?'translate-x-0':side==='l'?'-translate-x-full':'translate-x-full'}`}>
   <div className="h-full flex flex-col pt-[env(safe-area-inset-top)]"><div className="flex justify-end px-2 pt-1 lg:hidden"><Bt onClick={()=>side==='l'?setL(false):setR(false)}><Ic n="x"/></Bt></div><Side kind={kind} D={D} setD={setD} tok={tok} open={open}/></div></aside></>;
 return <div className="h-full">
  {drawer('l',L,'p')}{drawer('r',R,'l')}
  {bub&&<button onMouseDown={e=>e.preventDefault()} onPointerDown={e=>{e.preventDefault();selPara()}} style={{left:bub.x,top:bub.y,transform:'translateX(-50%)',WebkitUserSelect:'none',userSelect:'none'}} className="fixed z-40 h-9 px-3.5 rounded-full bg-[#111] text-white text-xs shadow-lg whitespace-nowrap">단락 선택</button>}
  {pend&&doc&&<IssuePick text={pend.text} issues={D.issues||[]} folders={D.folders||[]} onPick={id=>linkIssue(id)} onNew={n=>linkIssue(null,n)} onClose={()=>setPend(null)}/>}
  {info&&doc&&<Modal title="상세정보" onClose={()=>setInfo(false)}>
   <h2 className="t text-base font-normal leading-snug mb-3">{doc.title}</h2>
   <dl className="text-sm">{Object.entries(doc.fm||{}).filter(([k,v])=>v&&!/^(출처|source)$/i.test(k)).map(([k,v])=><div key={k} className="flex gap-3 py-1.5 border-t border-[#EEE]"><dt className="w-20 shrink-0 text-xs text-[#999] pt-0.5">{k}</dt><dd className="flex-1 min-w-0 break-words">{v}</dd></div>)}</dl>
   <div className="flex flex-wrap gap-2 mt-3 pt-3 border-t border-[#EEE]">
    {doc.src&&<a href={doc.src} target="_blank" rel="noreferrer" className="h-8 px-3 inline-flex items-center gap-1.5 text-xs border border-[#E5E5E5] rounded-md text-[#555] hover:border-[#111]"><Ic n="ext" s={13}/>원문</a>}
    <a href={`https://github.com/legalize-kr/${doc.repo}/blob/main/${enc(doc.path)}`} target="_blank" rel="noreferrer" className="h-8 px-3 inline-flex items-center gap-1.5 text-xs border border-[#E5E5E5] rounded-md text-[#555] hover:border-[#111]"><Ic n="ext" s={13}/>GitHub 파일</a></div>
   {(tags.length>0||inAny)&&<p className="text-xs text-[#7C8B74] mt-3 leading-relaxed">{tags.map(t=>'#'+t).join(' ')}{inAny&&<span className="block text-[#999]">리스트: {(D.lists||[]).filter(l=>l.ids.includes(doc.id)).map(l=>l.name).join(', ')}</span>}</p>}
  </Modal>}
  {ex&&doc&&<ExportModal jobs={[{repo:doc.repo,path:doc.path,rec,d:doc}]} onClose={()=>setEx(false)}/>}
  {rl&&doc&&<Modal title="읽은 기록" onClose={()=>setRl(false)}>
   {!reads.length&&<p className="text-xs text-[#999] py-2">읽은 기록이 없습니다.</p>}
   {reads.map((t,k)=>({t,k})).reverse().map(({t,k})=><div key={k+'-'+t} className="flex items-center gap-2 py-2 border-b border-[#F0F0EE] last:border-0 text-sm"><span className="w-9 text-xs text-[#999]">{k+1}회</span><span className="flex-1 tabular-nums">{fmtFull(t)}</span><button onClick={()=>delRead(k)} title="삭제" className="p-1 text-[#999] hover:text-[#111]"><Ic n="x" s={15}/></button></div>)}
  </Modal>}
  {toc&&doc&&<Modal title={'목차 · '+doc.title} onClose={()=>setToc(false)}><Toc tree={buildToc(doc)} go={goToc}/></Modal>}
  {lm&&doc&&<Modal title="리스트에 담기" onClose={()=>setLm(false)}>
   {!myLists.length&&<p className="text-xs text-[#999] pb-2">리스트가 없습니다. 아래에서 새로 만드세요.</p>}
   {myLists.map(l=>{const on=l.ids.includes(doc.id);return <button key={l.id} onClick={()=>toggleList(l.id)} className="w-full flex items-center gap-2.5 px-1 py-2.5 text-left text-sm rounded-md hover:bg-[#F6F6F4]"><span className={`w-4 h-4 shrink-0 rounded border flex items-center justify-center ${on?'bg-[#111] border-[#111] text-white':'border-[#CCC]'}`}>{on&&<Ic n="ck" s={11}/>}</span><span className="flex-1 min-w-0 truncate">{l.name}</span><span className="text-xs text-[#999]">{l.ids.length}</span></button>})}
   <div className="flex gap-1.5 pt-3 mt-2 border-t border-[#EEE]"><input value={nl} onChange={e=>setNl(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addList()} placeholder="새 리스트 이름" className="flex-1 min-w-0 h-9 px-2.5 text-sm border border-[#E5E5E5] rounded-md outline-none focus:border-[#111] bg-transparent"/><button onClick={addList} className={SB+" h-9"}>만들어 담기</button></div>
  </Modal>}
  <div className={`h-full flex flex-col transition-[margin] duration-200 ${L?'lg:ml-80':''} ${R?'lg:mr-80':''}`}>
   <header className="flex items-center gap-1 px-2 h-12 border-b border-[#E5E5E5] shrink-0 pt-[env(safe-area-inset-top)] box-content">
    <Bt on={L} onClick={()=>setL(!L)} title="판례"><Ic n="pl"/></Bt>
    <button onClick={()=>doc&&setInfo(true)} disabled={!doc} title="상세정보" className={`flex-1 min-w-0 px-2 h-10 text-center rounded-md transition-colors ${doc?'hover:bg-[#F6F6F4]':'cursor-default'}`}>{doc&&<><div className="text-sm truncate t font-normal flex items-center justify-center gap-1.5"><MarkIcons marks={marks} s={13}/><span className="truncate">{doc.title}</span></div><div className="text-[11px] text-[#999] truncate">{doc.meta}</div></>}</button>
    {doc&&<><Bt on={!!rec} onClick={toggleSave} title="서재에 저장"><Ic n="bm" s={17}/></Bt>{doc.src&&<a href={doc.src} target="_blank" rel="noreferrer" title="원문"><Bt><Ic n="ext" s={17}/></Bt></a>}</>}
    <Bt onClick={()=>{const t=prompt('GitHub 토큰(선택) — 요청 한도 확대·본문 검색용. 이 브라우저에만 저장됩니다.',tok);if(t!==null)setD(d=>({...d,token:t.trim()}))}} title="토큰" on={!!tok}><Ic n="key" s={17}/></Bt>
    <Bt on={R} onClick={()=>setR(!R)} title="법령·규칙"><Ic n="pr"/></Bt>
   </header>
   <div className="relative flex-1 min-h-0 flex flex-col"><main ref={sc} onScroll={onScroll} className="sb flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6">
     {busy&&<p className="py-20 text-center text-xs text-[#999]">불러오는 중</p>}
     {err&&!busy&&<p className="py-20 text-center text-xs text-[#8a5a44]">{err}</p>}
     {!doc&&!busy&&!err&&<div className="py-24"><Empty t="문서를 선택하세요"/></div>}
     {doc&&!busy&&<article key={doc.id}>
      <h1 className="t text-2xl font-normal text-black leading-snug mb-6" style={{letterSpacing:'-.03em'}}>{doc.title}</h1>
      {doc.secs.map((s,i)=><Section key={i} s={s} i={i} isOpen={!!op[i]} toggle={()=>setOp(o=>({...o,[i]:!o[i]}))} hls={hl[i]||[]} tool={tool} onSel={onSel} onU={pickU} sel={dsel} fs={D.fs} law={doc.repo!=='precedent-kr'}/>)}
      <div className="border-t border-[#E5E5E5]"/>
     </article>}
    </div>
   </main>
    {bar&&doc&&!busy&&<>
     {hasToc&&<div className="absolute left-2 bottom-2 z-10 flex flex-col gap-1.5">
      <button onClick={()=>stepArt(-1)} title="이전 조" className="w-9 h-9 rounded-full bg-black/[.07] hover:bg-black/10 text-black/45 flex items-center justify-center backdrop-blur-[2px]"><span className="rotate-180"><Ic n="cd" s={18}/></span></button>
      <button onClick={()=>setToc(true)} title="목차" className="w-9 h-9 rounded-full bg-black/[.07] hover:bg-black/10 text-black/45 flex items-center justify-center backdrop-blur-[2px]"><Ic n="tc" s={17}/></button>
      <button onClick={()=>stepArt(1)} title="다음 조" className="w-9 h-9 rounded-full bg-black/[.07] hover:bg-black/10 text-black/45 flex items-center justify-center backdrop-blur-[2px]"><Ic n="cd" s={18}/></button></div>}
     {prev&&<button onClick={()=>goN(prev)} title={'이전 · '+prev.title} className="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-5 h-14 rounded-r-xl bg-black/[.07] text-black/35 hover:bg-black/10 flex items-center justify-center"><Ic n="cl" s={14}/></button>}
     {next&&<button onClick={()=>goN(next)} title={'다음 · '+next.title} className="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-5 h-14 rounded-l-xl bg-black/[.07] text-black/35 hover:bg-black/10 flex items-center justify-center"><Ic n="cr" s={14}/></button>}
    </>}
    </div>
   {doc&&!busy&&<footer className={`relative shrink-0 pb-[env(safe-area-inset-bottom)] ${bar?'border-t border-[#E5E5E5]':''}`}>
    {dsel&&<button onClick={delSel} className="absolute right-4 -top-12 z-10 h-9 pl-3 pr-3.5 flex items-center gap-1.5 rounded-full bg-[#111] text-white text-xs shadow-lg"><Ic n="x" s={14}/>밑줄 삭제</button>}
    <button onClick={()=>{setBar(v=>!v);setMp(false)}} title={bar?'하단바 접기':'하단바 펼치기'} className={`absolute left-1/2 -translate-x-1/2 -top-3 z-10 w-10 h-5 rounded-full bg-white border border-[#E5E5E5] text-[#999] hover:text-[#111] flex items-center justify-center ${bar?'':'opacity-70'}`}><span className={bar?'':'rotate-180'}><Ic n="cd" s={14}/></span></button>
    {bar&&<>
    {mp&&<div className={`absolute ${hasToc?'left-14':'left-3'} -top-12 z-10 flex items-center gap-1 px-1.5 h-10 rounded-full bg-white border border-[#E5E5E5] shadow-lg`}>{MARKS.map(m=><button key={m.k} onClick={()=>toggleMark(m.k)} title={m.l} style={{opacity:marks.includes(m.k)?1:.4}} className={`w-8 h-8 rounded-full flex items-center justify-center transition-colors ${marks.includes(m.k)?'bg-[#F0F0EE]':'hover:bg-[#F6F6F4]'}`}><MarkIc m={m} s={18}/></button>)}</div>}
    <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-2 flex items-center gap-1.5 flex-nowrap overflow-x-auto" style={{scrollbarWidth:'none'}}>
     <span className="text-[#999] px-1 shrink-0"><Ic n="tag" s={15}/></span>
     {tags.map(t=><span key={t} className="inline-flex items-center gap-1 h-6 pl-2 pr-1 text-xs rounded-full bg-[#E6EBE1] shrink-0 whitespace-nowrap">{t}<button onClick={()=>upd(r=>({...r,tags:r.tags.filter(x=>x!==t)}))} className="text-[#777] hover:text-[#111]"><Ic n="x" s={12}/></button></span>)}
     <input list="tl" value={tg} onChange={e=>setTg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTag()} onBlur={addTag} placeholder="태그 추가" className="flex-1 min-w-24 h-7 text-sm outline-none bg-transparent"/>
     <datalist id="tl">{allTags.map(t=><option key={t} value={t}/>)}</datalist>
    </div>
    <div className="max-w-3xl mx-auto px-1.5 py-1 flex items-center flex-nowrap gap-0.5 max-sm:gap-0 max-sm:[&>button]:min-w-[28px] max-sm:[&>button]:px-1">
     <button onPointerDown={rdDown} onPointerUp={rdUp} onPointerLeave={rdCancel} onPointerCancel={rdCancel} onContextMenu={e=>e.preventDefault()} title="읽음 +1 (꾹 누르면 기록)" style={{WebkitTouchCallout:'none',WebkitUserSelect:'none',userSelect:'none',touchAction:'manipulation'}} className={`ml-0.5 mr-1 w-7 h-7 shrink-0 rounded-full border flex items-center justify-center text-[11px] tabular-nums transition-colors active:bg-[#E6EBE1] ${reads.length?'border-[#7C8B74] text-[#4A5A40] bg-[#F3F6F0]':'border-[#CCC] text-[#999]'}`}>{reads.length}</button>
     <Bt on={inAny} onClick={()=>setLm(true)} title="리스트에 담기"><Ic n="ls" s={17}/></Bt>
     <Bt onClick={()=>setEx(true)} title="MD로 내보내기"><Ic n="dl" s={17}/></Bt>
     <Bt on={mp} onClick={()=>setMp(v=>!v)} title="마크"><Ic n="fl" s={17}/></Bt>
     <div className="flex-1"/>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.max(13,d.fs-1)}))} title="글자 작게"><span className="text-xs">가</span></Bt>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.min(24,d.fs+1)}))} title="글자 크게"><span className="text-base">가</span></Bt>
     <Bt onClick={()=>setAll(true)} title="모두 펼치기"><Ic n="ud" s={17}/></Bt>
     <Bt onClick={()=>setAll(false)} title="모두 접기"><Ic n="du" s={17}/></Bt>
     <Bt on={tool==='a'} onMouseDown={e=>e.preventDefault()} onClick={()=>pick('a')} title="밑줄"><Ic n="ul" s={17}/></Bt>
    </div></>}
   </footer>}
  </div>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
