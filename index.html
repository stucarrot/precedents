function parse(txt,repo,path){

const findByName=async(no,tok)=>{const kw=(no.match(/[가-힣]+/)||[''])[0];

 const [path,setPath]=usePS('br:'+repo+':path',root),[ls,setLs]=useState(null),[err,setErr]=useState(''),[q,setQ]=usePS('br:'+repo+':q',''),[n,setN]=useState(80),[hits,setHits]=useState(null);const fst=useRef(1);

 const terms=q.trim().split(/\s+/).filter(Boolean);

function CaseSearch({tok,open}){
 const [q,setQ]=usePS('cs:q',''),[rows,setRows]=usePS('cs:rows',null),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
 const run=async()=>{
  const m=q.match(/\d{2,4}\s*[가-힣]{1,4}\s*\d+/);const no=m?m[0].replace(/\s/g,''):q.trim();if(!no)return;

   const d=q.match(/\d{4}-\d{2}-\d{2}/);
   if(d&&m){const court=q.slice(0,d.index).trim()||'대법원',gr=court==='대법원'?'대법원':'하급심',f=`${court}_${d[0]}_${no}.md`;
    for(const k of ['민사','형사','일반행정','세무','가사','특허','선거·특별','기타']){const p=`${k}/${gr}/${f}`;
     const r=await fetch(`https://raw.githubusercontent.com/legalize-kr/precedent-kr/main/${enc(p)}`,{method:'HEAD'}).catch(()=>null);
     if(r&&r.ok){open('precedent-kr',p);setBusy(false);return}}}
   let r=await findByName(no,tok),note='';
   if(!r.length&&tok){try{
    const s=x=>gh(`/search/code?q=${encodeURIComponent(`"${no}" ${x} repo:legalize-kr/precedent-kr`)}&per_page=50`,tok).then(j=>j.items).catch(e=>{if(/valid/i.test(e.message))return[];throw e});
    const a=await s('in:path'),b=await s('in:file');const seen={};
    r=[...a,...b].filter(i=>!seen[i.path]&&(seen[i.path]=1)).map(i=>i.path)}catch(e){if(!e.net)throw e;note='파일명으로는 찾지 못했고, 본문 검색(GitHub 코드검색)은 연결이 끊겨 실행하지 못했습니다.'}}
   r.sort((x,y)=>(y.split('_')[1]||'').localeCompare(x.split('_')[1]||''));setRows(r);if(note&&!r.length)setErr(note);if(r.length===1)open('precedent-kr',r[0])
  }catch(e){setErr(e.message)}
  setBusy(false)};

  <div className="px-4 pt-3"><div className="flex items-center gap-2 border border-[#E5E5E5] rounded-md px-2.5 h-9 focus-within:border-[#111] transition-colors"><span className="text-[#999]"><Ic n="search" s={15}/></span>
   <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&run()} placeholder="사건번호 (예: 2022다12345)" className="flex-1 min-w-0 outline-none text-sm bg-transparent"/>

  </div></div>}

function Multi({list,D,setD,tok,onBack}){
 const [txt,setTxt]=useState(''),[busy,setBusy]=useState(false),[prog,setProg]=useState(''),[res,setRes]=useState(null);
 const run=async()=>{
  const lines=txt.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  setBusy(true);setRes(null);const out=[],recs=[],have=new Set(list.ids),added=[];
  for(let i=0;i<lines.length;i++){
   setProg(`${i+1} / ${lines.length}`);const ln=lines[i],m=ln.match(CASE);
   if(!m){out.push({ln,st:'사건번호 형식이 아님',ok:0});continue}
   const no=m[0].replace(/\s/g,''),dm=ln.match(/\d{4}-\d{2}-\d{2}/);let r;
   try{r=await findByName(no,tok)}catch(e){out.push({ln,st:e.message,ok:0});if(/한도/.test(e.message))break;continue}
   if(dm){const f=r.filter(p=>p.includes(dm[0]));if(f.length)r=f}
   if(!r.length){out.push({ln,st:'검색 결과 없음',ok:0});continue}
   let pk=r,st='추가됨';
   if(r.length>1){pk=r.filter(isSup);if(!pk.length){out.push({ln,st:`${r.length}건 검색됨 · 대법원 판결이 없어 제외`,ok:0});continue}st=`${r.length}건 중 대법원 ${pk.length}건만 추가`}
   let n=0,dup=0;
   for(const p of pk){const id='precedent-kr:'+p;if(have.has(id)){dup++;continue}
    let rec;try{const d=await fetchDoc('precedent-kr',p);rec={id:d.id,repo:d.repo,path:p,title:d.title,meta:d.meta,tags:[],hl:{}}}
    catch{const L=label('precedent-kr',p.split('/').pop(),p);rec={id,repo:'precedent-kr',path:p,title:L.a,meta:L.b,tags:[],hl:{}}}
    recs.push(rec);have.add(id);added.push(id);n++}
   out.push(n?{ln,st:st+(dup?` · ${dup}건 중복 제외`:''),ok:1}:{ln,st:'이미 리스트에 있음',ok:2});
  }
  setD(d=>{const docs={...d.docs};recs.forEach(r=>{if(!docs[r.id])docs[r.id]=r});

 const setAll=v=>setOp(Object.fromEntries(doc.secs.map((_,i)=>[i,v])));
 const setKey=()=>{const o={};doc.secs.forEach((s,i)=>o[i]=doc.repo!=='precedent-kr'||KEY.test(s.h))};
 const toggleSave=()=>{if(rec){if((rec.tags.length||Object.values(rec.hl).some(a=>a.length))&&!confirm('태그와 하이라이트도 함께 삭제되고 리스트에서도 빠집니다.'))return;setD(d=>rm(d,[doc.id]))}else upd(r=>r)};
 const Bt=({on,children,...p})=><button {...p} className={`h-9 min-w-9 px-2 flex items-center justify-center rounded-md transition-colors hover:bg-[#F0F0EE] ${on?'bg-[#E6EBE1]':''} ${p.className||''}`}>{children}</button>;
 const drawer=(side,on,kind)=><><div onClick={()=>side==='l'?setL(false):setR(false)} className={`lg:hidden fixed inset-0 bg-black/20 z-20 transition-opacity ${on?'opacity-100':'opacity-0 pointer-events-none'}`}/>
  <aside className={`fixed top-0 bottom-0 z-30 w-[88vw] max-w-80 lg:w-80 bg-white transition-transform duration-200 ${side==='l'?'left-0 border-r':'right-0 border-r-0 border-l'} border-[#E5E5E5] ${on?'translate-x-0':side==='l'?'-translate-x-full':'translate-x-full'}`}>
   <div className="h-full flex flex-col pt-[env(safe-area-inset-top)]"><div className="flex justify-end px-2 pt-1 lg:hidden"><Bt onClick={()=>side==='l'?setL(false):setR(false)}><Ic n="x"/></Bt></div><Side kind={kind} D={D} setD={setD} tok={tok} open={open}/></div></aside></>;
 return <div className="h-full">
  {drawer('l',L,'p')}{drawer('r',R,'l')}
  {info&&doc&&<Modal title="상세정보" onClose={()=>setInfo(false)}>
   <h2 className="t text-base font-normal leading-snug mb-3">{doc.title}</h2>
   <dl className="text-sm">{Object.entries(doc.fm||{}).filter(([k,v])=>v&&!/^(출처|source)$/i.test(k)).map(([k,v])=><div key={k} className="flex gap-3 py-1.5 border-t border-[#EEE]"><dt className="w-20 shrink-0 text-xs text-[#999] pt-0.5">{k}</dt><dd className="flex-1 min-w-0 break-words">{v}</dd></div>)}</dl>
   <div className="flex flex-wrap gap-2 mt-3 pt-3 border-t border-[#EEE]">
    {doc.src&&<a href={doc.src} target="_blank" rel="noreferrer" className="h-8 px-3 inline-flex items-center gap-1.5 text-xs border border-[#E5E5E5] rounded-md text-[#555] hover:border-[#111]"><Ic n="ext" s={13}/>원문</a>}
    <a href={`https://github.com/legalize-kr/${doc.repo}/blob/main/${enc(doc.path)}`} target="_blank" rel="noreferrer" className="h-8 px-3 inline-flex items-center gap-1.5 text-xs border border-[#E5E5E5] rounded-md text-[#555] hover:border-[#111]"><Ic n="ext" s={13}/>GitHub 파일</a></div>
   {(tags.length>0||inAny)&&<p className="text-xs text-[#7C8B74] mt-3 leading-relaxed">{tags.map(t=>'#'+t).join(' ')}{inAny&&<span className="block text-[#999]">리스트: {(D.lists||[]).filter(l=>l.ids.includes(doc.id)).map(l=>l.name).join(', ')}</span>}</p>}
  </Modal>}
  {lm&&doc&&<Modal title="리스트에 담기" onClose={()=>setLm(false)}>
   {!myLists.length&&<p className="text-xs text-[#999] pb-2">리스트가 없습니다. 아래에서 새로 만드세요.</p>}
   {myLists.map(l=>{const on=l.ids.includes(doc.id);return <button key={l.id} onClick={()=>toggleList(l.id)} className="w-full flex items-center gap-2.5 px-1 py-2.5 text-left text-sm rounded-md hover:bg-[#F6F6F4]"><span className={`w-4 h-4 shrink-0 rounded border flex items-center justify-center ${on?'bg-[#111] border-[#111] text-white':'border-[#CCC]'}`}>{on&&<Ic n="ck" s={11}/>}</span><span className="flex-1 min-w-0 truncate">{l.name}</span><span className="text-xs text-[#999]">{l.ids.length}</span></button>})}
   <div className="flex gap-1.5 pt-3 mt-2 border-t border-[#EEE]"><input value={nl} onChange={e=>setNl(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addList()} placeholder="새 리스트 이름" className="flex-1 min-w-0 h-9 px-2.5 text-sm border border-[#E5E5E5] rounded-md outline-none focus:border-[#111] bg-transparent"/><button onClick={addList} className={SB+" h-9"}>만들어 담기</button></div>
  </Modal>}
  <div className={`h-full flex flex-col transition-[margin] duration-200 ${L?'lg:ml-80':''} ${R?'lg:mr-80':''}`}>
   <header className="flex items-center gap-1 px-2 h-12 border-b border-[#E5E5E5] shrink-0 pt-[env(safe-area-inset-top)] box-content">
    <Bt on={L} onClick={()=>setL(!L)} title="판례"><Ic n="pl"/></Bt>
    <button onClick={()=>doc&&setInfo(true)} disabled={!doc} title="상세정보" className={`flex-1 min-w-0 px-2 h-10 text-center rounded-md transition-colors ${doc?'hover:bg-[#F6F6F4]':'cursor-default'}`}>{doc&&<><div className="text-sm truncate t font-normal">{doc.title}</div><div className="text-[11px] text-[#999] truncate">{doc.meta}</div></>}</button>
    {doc&&<><Bt on={!!rec} onClick={toggleSave} title="서재에 저장"><Ic n="bm" s={17}/></Bt>{doc.src&&<a href={doc.src} target="_blank" rel="noreferrer" title="원문"><Bt><Ic n="ext" s={17}/></Bt></a>}</>}
    <Bt onClick={()=>{const t=prompt('GitHub 토큰(선택) — 요청 한도 확대·본문 검색용. 이 브라우저에만 저장됩니다.',tok);if(t!==null)setD(d=>({...d,token:t.trim()}))}} title="토큰" on={!!tok}><Ic n="key" s={17}/></Bt>
    <Bt on={R} onClick={()=>setR(!R)} title="법령·규칙"><Ic n="pr"/></Bt>
   </header>
   <main ref={sc} onScroll={onScroll} className="sb flex-1 overflow-y-auto">
    <div className="max-w-2xl mx-auto px-5 py-6">
     {busy&&<p className="py-20 text-center text-xs text-[#999]">불러오는 중</p>}
     {err&&!busy&&<p className="py-20 text-center text-xs text-[#8a5a44]">{err}</p>}
     {!doc&&!busy&&!err&&<div className="py-24"><Empty t="문서를 선택하세요"/></div>}
     {doc&&!busy&&<article key={doc.id}>
      <h1 className="t text-2xl font-normal leading-snug mb-6" style={{letterSpacing:'-.03em'}}>{doc.title}</h1>
      {doc.secs.map((s,i)=><Section key={i} s={s} i={i} isOpen={!!op[i]} toggle={()=>setOp(o=>({...o,[i]:!o[i]}))} hls={hl[i]||[]} tool={tool} onSel={onSel} onDel={delHl} fs={D.fs}/>)}
      <div className="border-t border-[#E5E5E5]"/>
     </article>}
    </div>
   </main>
   {doc&&!busy&&<footer className="border-t border-[#E5E5E5] shrink-0 pb-[env(safe-area-inset-bottom)]">
    <div className="max-w-2xl mx-auto px-3 pt-2 flex items-center gap-1.5 flex-wrap">
     <span className="text-[#999] px-1"><Ic n="tag" s={15}/></span>
     {tags.map(t=><span key={t} className="inline-flex items-center gap-1 h-6 pl-2 pr-1 text-xs rounded-full bg-[#E6EBE1]">{t}<button onClick={()=>upd(r=>({...r,tags:r.tags.filter(x=>x!==t)}))} className="text-[#777] hover:text-[#111]"><Ic n="x" s={12}/></button></span>)}
     <input list="tl" value={tg} onChange={e=>setTg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTag()} onBlur={addTag} placeholder="태그 추가" className="flex-1 min-w-24 h-7 text-sm outline-none bg-transparent"/>
     <datalist id="tl">{allTags.map(t=><option key={t} value={t}/>)}</datalist>
    </div>
    <div className="max-w-2xl mx-auto px-2 py-1 flex items-center gap-0.5">
     {Object.entries(COL).map(([c,v])=><Bt key={c} on={tool===c} onMouseDown={e=>e.preventDefault()} onClick={()=>pick(c)} title="하이라이트"><span className="w-4 h-4 rounded-full border border-[#D5D5D0]" style={{background:v}}/></Bt>)}
     <Bt on={tool==='x'} onMouseDown={e=>e.preventDefault()} onClick={()=>pick('x')} title="하이라이트 지우기"><Ic n="er" s={17}/></Bt>
     <Bt on={inAny} onClick={()=>setLm(true)} title="리스트에 담기"><Ic n="ls" s={17}/></Bt>
     <div className="flex-1"/>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.max(13,d.fs-1)}))} title="글자 작게"><span className="text-xs">가</span></Bt>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.min(24,d.fs+1)}))} title="글자 크게"><span className="text-base">가</span></Bt>
     <Bt onClick={()=>setAll(true)} title="모두 펼치기"><Ic n="ud" s={17}/></Bt>
     <Bt onClick={()=>setAll(false)} title="모두 접기"><Ic n="du" s={17}/></Bt>
    </div>
   </footer>}
  </div>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
