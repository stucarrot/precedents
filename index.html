function CaseSearch({tok,open}){

   const d=parse(await r.text(),repo,path);const keys=d.secs.filter(s=>s.h&&KEY.test(s.h));const first=d.secs.find(s=>s.h);const o={};
   d.secs.forEach((s,i)=>{o[i]=repo!=='precedent-kr'||(keys.length?KEY.test(s.h):s===first)});
   setOp(o);setDoc(d);sc.current&&sc.current.scrollTo(0,0)}catch(e){setErr(e.message)}setBusy(false)};
 const rec=doc&&D.docs[doc.id];const tags=rec?rec.tags:[],hl=rec?rec.hl:{};
 const upd=f=>setD(d=>{const r=d.docs[doc.id]||{id:doc.id,repo:doc.repo,path:doc.path,title:doc.title,meta:doc.meta,tags:[],hl:{}};return{...d,docs:{...d.docs,[doc.id]:f(r)}}});
 const addHl=(i,h)=>upd(r=>({...r,hl:{...r.hl,[i]:[...(r.hl[i]||[]),h]}}));
 const delHl=(i,k)=>upd(r=>({...r,hl:{...r.hl,[i]:r.hl[i].filter((_,x)=>x!==k)}}));
 const onSel=(i,box)=>setTimeout(()=>{if(!tool||tool==='x')return;const s=getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);
  if(!box.contains(r.startContainer)||!box.contains(r.endContainer))return;const pre=document.createRange();pre.selectNodeContents(box);pre.setEnd(r.startContainer,r.startOffset);
  const a=pre.toString().length;addHl(i,[a,a+r.toString().length,tool]);s.removeAllRanges()},30);
 const pick=c=>{setTool(t=>t===c?null:c);const s=getSelection();if(c!=='x'&&s&&!s.isCollapsed){const n=s.anchorNode&&(s.anchorNode.nodeType===3?s.anchorNode.parentElement:s.anchorNode).closest('[data-b]');if(n){const i=[...document.querySelectorAll('[data-b]')].indexOf(n);const idx=doc.secs.map((x,k)=>k);const r=s.getRangeAt(0);if(n.contains(r.endContainer)){const pre=document.createRange();pre.selectNodeContents(n);pre.setEnd(r.startContainer,r.startOffset);const a=pre.toString().length;addHl(idx[i],[a,a+r.toString().length,c]);s.removeAllRanges()}}}};
 const addTag=()=>{const t=tg.trim().replace(/^#/,'');if(t&&!tags.includes(t))upd(r=>({...r,tags:[...r.tags,t]}));setTg('')};
 const allTags=[...new Set(Object.values(D.docs).flatMap(d=>d.tags))];
 const setAll=v=>setOp(Object.fromEntries(doc.secs.map((_,i)=>[i,v])));
 const setKey=()=>{const o={};doc.secs.forEach((s,i)=>o[i]=doc.repo!=='precedent-kr'||KEY.test(s.h))};
 const toggleSave=()=>{if(rec){if((rec.tags.length||Object.values(rec.hl).some(a=>a.length))&&!confirm('태그와 하이라이트도 함께 삭제됩니다.'))return;setD(d=>{const x={...d.docs};delete x[doc.id];return{...d,docs:x}})}else upd(r=>r)};
 const Bt=({on,children,...p})=><button {...p} className={`h-9 min-w-9 px-2 flex items-center justify-center rounded-md transition-colors hover:bg-[#F0F0EE] ${on?'bg-[#E6EBE1]':''} ${p.className||''}`}>{children}</button>;
 const drawer=(side,on,kind)=><><div onClick={()=>side==='l'?setL(false):setR(false)} className={`lg:hidden fixed inset-0 bg-black/20 z-20 transition-opacity ${on?'opacity-100':'opacity-0 pointer-events-none'}`}/>
  <aside className={`fixed top-0 bottom-0 z-30 w-[88vw] max-w-80 lg:w-80 bg-white transition-transform duration-200 ${side==='l'?'left-0 border-r':'right-0 border-r-0 border-l'} border-[#E5E5E5] ${on?'translate-x-0':side==='l'?'-translate-x-full':'translate-x-full'}`}>
   <div className="h-full flex flex-col pt-[env(safe-area-inset-top)]"><div className="flex justify-end px-2 pt-1 lg:hidden"><Bt onClick={()=>side==='l'?setL(false):setR(false)}><Ic n="x"/></Bt></div><Side kind={kind} D={D} tok={tok} open={open}/></div></aside></>;
 return <div className="h-full">
  {drawer('l',L,'p')}{drawer('r',R,'l')}
  <div className={`h-full flex flex-col transition-[margin] duration-200 ${L?'lg:ml-80':''} ${R?'lg:mr-80':''}`}>
   <header className="flex items-center gap-1 px-2 h-12 border-b border-[#E5E5E5] shrink-0 pt-[env(safe-area-inset-top)] box-content">
    <Bt on={L} onClick={()=>setL(!L)} title="판례"><Ic n="pl"/></Bt>
    <div className="flex-1 min-w-0 px-2 text-center">{doc&&<><div className="text-sm truncate t font-normal">{doc.title}</div><div className="text-[11px] text-[#999] truncate">{doc.meta}</div></>}</div>
    {doc&&<><Bt on={!!rec} onClick={toggleSave} title="서재에 저장"><Ic n="bm" s={17}/></Bt>{doc.src&&<a href={doc.src} target="_blank" rel="noreferrer" title="원문"><Bt><Ic n="ext" s={17}/></Bt></a>}</>}
    <Bt onClick={()=>{const t=prompt('GitHub 토큰(선택) — 요청 한도 확대·본문 검색용. 이 브라우저에만 저장됩니다.',tok);if(t!==null)setD(d=>({...d,token:t.trim()}))}} title="토큰" on={!!tok}><Ic n="key" s={17}/></Bt>
    <Bt on={R} onClick={()=>setR(!R)} title="법령·규칙"><Ic n="pr"/></Bt>
   </header>
   <main ref={sc} className="sb flex-1 overflow-y-auto">
    <div className="max-w-2xl mx-auto px-5 py-6">
     {busy&&<p className="py-20 text-center text-xs text-[#999]">불러오는 중</p>}
     {err&&!busy&&<p className="py-20 text-center text-xs text-[#8a5a44]">{err}</p>}
     {!doc&&!busy&&!err&&<div className="py-24"><Empty t="문서를 선택하세요"/></div>}
     {doc&&!busy&&<article key={doc.id}>
      <h1 className="t text-2xl font-normal leading-snug mb-6" style={{letterSpacing:'-.03em'}}>{doc.title}</h1>
      {doc.secs.map((s,i)=><Section key={i} s={s} i={i} isOpen={!!op[i]} toggle={()=>setOp(o=>({...o,[i]:!o[i]}))} hls={hl[i]||[]} tool={tool} onSel={onSel} onDel={delHl} fs={D.fs}/>)}
      <div className="border-t border-[#E5E5E5]"/>
     </article>}
    </div>
   </main>
   {doc&&!busy&&<footer className="border-t border-[#E5E5E5] shrink-0 pb-[env(safe-area-inset-bottom)]">
    <div className="max-w-2xl mx-auto px-3 pt-2 flex items-center gap-1.5 flex-wrap">
     <span className="text-[#999] px-1"><Ic n="tag" s={15}/></span>
     {tags.map(t=><span key={t} className="inline-flex items-center gap-1 h-6 pl-2 pr-1 text-xs rounded-full bg-[#E6EBE1]">{t}<button onClick={()=>upd(r=>({...r,tags:r.tags.filter(x=>x!==t)}))} className="text-[#777] hover:text-[#111]"><Ic n="x" s={12}/></button></span>)}
     <input list="tl" value={tg} onChange={e=>setTg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTag()} onBlur={addTag} placeholder="태그 추가" className="flex-1 min-w-24 h-7 text-sm outline-none bg-transparent"/>
     <datalist id="tl">{allTags.map(t=><option key={t} value={t}/>)}</datalist>
    </div>
    <div className="max-w-2xl mx-auto px-2 py-1 flex items-center gap-0.5">
     {Object.entries(COL).map(([c,v])=><Bt key={c} on={tool===c} onMouseDown={e=>e.preventDefault()} onClick={()=>pick(c)} title="하이라이트"><span className="w-4 h-4 rounded-full border border-[#D5D5D0]" style={{background:v}}/></Bt>)}
     <Bt on={tool==='x'} onMouseDown={e=>e.preventDefault()} onClick={()=>pick('x')} title="하이라이트 지우기"><Ic n="er" s={17}/></Bt>
     <div className="flex-1"/>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.max(13,d.fs-1)}))} title="글자 작게"><span className="text-xs">가</span></Bt>
     <Bt onClick={()=>setD(d=>({...d,fs:Math.min(24,d.fs+1)}))} title="글자 크게"><span className="text-base">가</span></Bt>
     <Bt onClick={()=>setAll(true)} title="모두 펼치기"><Ic n="ud" s={17}/></Bt>
     <Bt onClick={()=>setAll(false)} title="모두 접기"><Ic n="du" s={17}/></Bt>
    </div>
   </footer>}
  </div>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
